[package]
name = "runit-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
fs4 = "0.13"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
sha2 = "0.10"
flate2 = "1"
getrandom = "0.3"

# Hardware SHA-256 on Apple silicon. x86 uses its own instructions without this.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Power", "Win32_System_Threading"] }

[features]
# Tests that need RUNIT_ENGINE_DIR and run the real engine.
live = []

[[test]]
name = "live"
required-features = ["live"]

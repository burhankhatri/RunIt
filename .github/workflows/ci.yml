name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Rust tests
        run: cargo test --workspace
      - name: Build
        run: scripts/build-macos.sh ${{ matrix.arch }}
      - name: Swift tests
        run: swift test --package-path apps/macos -Xlinker "$PWD/target/$([ ${{ matrix.arch }} = arm64 ] && echo aarch64 || echo x86_64)-apple-darwin/release/librunit.a"
      - name: Engine tests
        env: { RUNIT_ENGINE_DIR: "${{ github.workspace }}/engines/macos-${{ matrix.arch }}" }
        run: cargo test -p runit-core --features live --test live
      - name: Rehearse the app
        run: |
          mkdir -p shots
          export RUNIT_DATA_DIR="$PWD/data-ci" RUNIT_SHOTS="$PWD/shots"
          dist/RunIt.app/Contents/MacOS/runit-cli get hf-model-liquidai-lfm2-5-230m-gguf Q4_K_M | tr '\r' '\n' | tail -1
          perl -e 'alarm 1500; exec @ARGV' dist/RunIt.app/Contents/MacOS/RunIt 2>&1 | tee shots/log.txt
          grep -q 'REHEARSAL OK' shots/log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "shots-macos-${{ matrix.arch }}", path: shots }

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - name: Rust tests
        run: cargo test --workspace
      - name: Build
        run: scripts/build-windows.ps1
      - name: Engine tests
        env: { RUNIT_ENGINE_DIR: "${{ github.workspace }}\\dist\\RunIt\\engine" }
        run: cargo test -p runit-core --features live --test live
      - name: Rehearse the app
        run: |
          $env:RUNIT_DATA_DIR = "$pwd\data-ci"; $env:RUNIT_SHOTS = "$pwd\shots"; $env:RUNIT_FETCH = 'hf-model-liquidai-lfm2-5-230m-gguf'
          $p = Start-Process dist\RunIt\RunIt.exe -PassThru
          if (-not $p.WaitForExit(1800000)) { $p.Kill(); throw 'the rehearsal did not finish' }
          Get-Content shots\log.txt
          if (-not (Select-String 'REHEARSAL OK' shots\log.txt)) { throw 'the rehearsal failed' }
          if (Get-Process llama-server -ErrorAction SilentlyContinue) { throw 'an engine process was left behind' }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: shots-windows, path: shots }
